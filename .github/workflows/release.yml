name: Build and release

# Builds the Mac DMG and the Windows installer on rented runners, so a release
# no longer depends on sitting at (or being SSH'd into) either machine.
#
# PyInstaller cannot cross-compile — it bundles the target platform's actual
# interpreter and native extensions — and the Mac build additionally needs
# hdiutil/create-dmg and the .app layout, the Windows one needs Inno Setup. A
# macos-latest and a windows-latest runner supply exactly that.
#
# Two ways in:
#   * push a tag (works from any shell, phone included)
#       release-0.1.112             both platforms
#       release-windows-0.1.112     Windows only
#       release-mac-0.1.112         Mac only
#       ...-rc                      publish as a prerelease
#   * Actions > Build and release > Run workflow
#
# The -rc suffix matters for anything built by a runner for the first time:
# updater._find_update skips draft and prerelease entries, so an rc is
# downloadable from the releases page but is never pushed to users. Test it,
# then clear the prerelease flag to ship it.
#
# The local release_mac.sh / release_windows.bat still work and are untouched.
# This does the same steps in the same order: bump every version file, commit,
# build, then publish vX.Y.Z-mac and vX.Y.Z-windows with their assets.

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, x.y.z (e.g. 0.1.112)"
        required: true
      platforms:
        description: "Which installers to build"
        type: choice
        options: [both, windows, mac]
        default: both
      prerelease:
        description: "Publish as a prerelease (the in-app updater skips these)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
      mac: ${{ steps.resolve.outputs.mac }}
      windows: ${{ steps.resolve.outputs.windows }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version and platforms
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            rest="${GITHUB_REF_NAME#release-}"          # [platform-]x.y.z[-rc]
            prerelease=false
            # -rc, -rc2, -rc3 ... so a failed attempt can be retried without
            # burning a version number.
            case "$rest" in
              *-rc|*-rc[0-9]*) prerelease=true; rest="${rest%-rc*}" ;;
            esac
            case "$rest" in
              windows-*) platforms=windows; version="${rest#windows-}" ;;
              mac-*)     platforms=mac;     version="${rest#mac-}" ;;
              *)         platforms=both;    version="$rest" ;;
            esac
          else
            version="${{ inputs.version }}"
            platforms="${{ inputs.platforms }}"
            prerelease="${{ inputs.prerelease }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          case "$platforms" in
            both)
              echo "mac=true" >> "$GITHUB_OUTPUT"
              echo "windows=true" >> "$GITHUB_OUTPUT" ;;
            mac)     echo "mac=true" >> "$GITHUB_OUTPUT" ;;
            windows) echo "windows=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown platforms value: $platforms"; exit 1 ;;
          esac
          echo "Releasing $version ($platforms)"

      - name: Run the test suite
        # Cheap, and it is the only gate before two runners spend ten minutes
        # building something broken.
        run: for f in tests/test_*.py; do python3 "$f" || exit 1; done

      - name: Bump the version everywhere
        id: bump
        run: |
          python3 tools/set_version.py "${{ steps.resolve.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flipper_daemon/version.py language_flipper.spec language_flipper_setup.iss
          # Nothing staged means the files were already at this version, which
          # is fine — a re-run of a failed release must not abort here.
          git diff --cached --quiet \
            || git commit -m "bump version to ${{ steps.resolve.outputs.version }} (ci)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: prepare
    if: needs.prepare.outputs.mac == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Commented out in requirements.txt because they are macOS-only.
          pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz \
                      pyobjc-framework-ApplicationServices
          brew install create-dmg

      - name: Build the app and DMG
        # LF_SKIP_RELAUNCH: there is no installed app on a runner to put back,
        # and the relaunch branch would only run on a developer machine anyway.
        run: LF_SKIP_RELAUNCH=1 ./build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/Language.Flipper.dmg
          if-no-files-found: error

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install the python.org build of Python
        # Deliberately NOT actions/setup-python. Key Past Bug #8: a
        # python-build-standalone interpreter (what uv installs, and what some
        # tooling substitutes) keeps vcruntime140.dll in its own folder, where
        # LoadLibrary cannot find it from PyInstaller's _MEI temp folder — the
        # frozen exe then dies on every launch. The official installer
        # registers vcruntime system-wide, which is what release_windows.bat
        # pins locally.
        #
        # Chocolatey is deliberately not used: it reported success three times
        # while installing nothing at all (rc3 proved C:\Py313 was empty),
        # almost certainly treating the package as already present. Running the
        # python.org installer directly is both deterministic about where the
        # interpreter lands and literally the thing CLAUDE.md requires.
        #
        # InstallAllUsers also puts the VC++ runtime in System32, which is the
        # actual mechanism that makes Key Past Bug #8 stay fixed.
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.13.1/python-3.13.1-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile python-installer.exe
          $p = Start-Process -FilePath .\python-installer.exe -Wait -PassThru -ArgumentList `
                 "/quiet", "InstallAllUsers=1", "TargetDir=C:\Py313",
                 "PrependPath=0", "Include_test=0", "Include_launcher=0"
          if ($p.ExitCode -ne 0) {
            Write-Output "::error::python.org installer exited $($p.ExitCode)"
            exit 1
          }

      - name: Locate and verify the interpreter
        # Findings go out as ::notice:: / ::error:: because those become check
        # annotations, which are readable from the public API — job logs are
        # not, so a failure here would otherwise be a bare "exit code 1".
        shell: pwsh
        run: |
          # Search rather than guess: rc2 proved C:\Py313 exists while none of
          # the four paths I predicted held python.exe, so the package nests it
          # somewhere of its own choosing.
          $roots = @(
            "C:\Py313",
            "C:\Python313",
            "C:\Program Files\Python313",
            "$env:LOCALAPPDATA\Programs\Python"
          )
          $exe = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $hit = Get-ChildItem -Path $root -Filter python.exe -Recurse -Depth 3 `
                     -ErrorAction SilentlyContinue |
                   Where-Object { $_.DirectoryName -notmatch 'Scripts|venv|Lib' } |
                   Select-Object -First 1
            if ($hit) { $exe = $hit.FullName; break }
          }
          if (-not $exe) {
            $tree = (Get-ChildItem C:\Py313 -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                     Select-Object -First 50 -ExpandProperty FullName) -join '%0A'
            Write-Output "::error::no python.exe under $($roots -join ' ; ')%0AC:\Py313 contains:%0A$tree"
            exit 1
          }
          $version = & $exe -c "import sys; print(sys.version.split()[0])"
          $base = & $exe -c "import sys; print(sys.base_prefix)"
          Write-Output "::notice::using $exe (Python $version, base_prefix $base)"
          "PYTHON=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          $log = "pip-install.log"
          & $env:PYTHON -m pip install --upgrade pip *>&1 | Tee-Object -FilePath $log
          & $env:PYTHON -m pip install -r requirements.txt pyinstaller *>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 20) -join '%0A')
            Write-Output "::error::pip failed (exit $LASTEXITCODE): $tail"
            exit 1
          }

      - name: Build the exe
        shell: pwsh
        run: |
          $log = "pyinstaller.log"
          & $env:PYTHON -m PyInstaller --clean --noconfirm language_flipper_windows.spec *>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 20) -join '%0A')
            Write-Output "::error::PyInstaller failed (exit $LASTEXITCODE): $tail"
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Package the installer
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" language_flipper_setup.iss'
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Language-Flipper-Setup.exe
          if-no-files-found: error

  publish:
    needs: [prepare, build-mac, build-windows]
    # Publish whatever built. A skipped build (platforms=windows, say) is
    # neither success nor failure, so the default "all needs succeeded" rule
    # would skip this job too — but a build that actually FAILED must stop it.
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.build-mac.result != 'failure'
      && needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -e
          FLAG=""
          [ "$PRERELEASE" = "true" ] && FLAG="--prerelease"

          # Separate -mac and -windows tags, kept because both the in-app
          # updater and the site scan every release for their platform's asset
          # and compare versions themselves (Key Past Bug #5).
          if [ -f "artifacts/mac-dmg/Language.Flipper.dmg" ]; then
            gh release create "v${VERSION}-mac" \
              "artifacts/mac-dmg/Language.Flipper.dmg" \
              --title "Language Flipper ${VERSION} — macOS" --generate-notes $FLAG
          fi
          if [ -f "artifacts/windows-installer/Language-Flipper-Setup.exe" ]; then
            gh release create "v${VERSION}-windows" \
              "artifacts/windows-installer/Language-Flipper-Setup.exe" \
              --title "Language Flipper ${VERSION} - Windows" --generate-notes $FLAG
          fi

      - name: Trigger the site rebuild
        # Nothing to rebuild for an rc: site/src/lib/releases.ts skips draft and
        # prerelease entries exactly like the updater does, so the download
        # buttons cannot have moved.
        if: needs.prepare.outputs.prerelease != 'true'
        # rebuild-site-on-release.yml cannot help here: a release created with
        # GITHUB_TOKEN does not raise a `release` event, by design, so that
        # workflow never fires for a CI release. Cloudflare Workers Builds
        # reacts to the push webhook rather than to Actions, so an empty commit
        # still gets the download buttons rebuilt against the new release.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git commit --allow-empty \
            -m "chore: rebuild site for v${{ needs.prepare.outputs.version }}"
          git push origin HEAD:main
