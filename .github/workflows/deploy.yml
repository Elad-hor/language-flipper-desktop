name: Deploy site to Hostinger

# Auto-build the Astro site and upload it to Hostinger over FTPS whenever the
# site changes on main. No more manual File Manager uploads.
# (re-run trigger)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assemble deploy folder (built site + contact.php + .htaccess)
        working-directory: site
        run: |
          rm -rf _deploy && mkdir _deploy
          cp -r dist/. _deploy/
          cp contact/contact.php _deploy/contact.php
          printf '%s\n' \
            'RedirectMatch 301 ^/attributes/?$ /' \
            'RedirectMatch 301 ^/category/uncategorized/?$ /' \
            'RedirectMatch 301 ^/sitemap_index\.xml$ /sitemap-index.xml' \
            > _deploy/.htaccess

      - name: Deploy over FTPS (lftp)
        working-directory: site
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Tolerate a pasted "ftp://host" or "host/path" in the secret — keep only the host.
          HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#[[:space:]]##g')
          echo "Uploading site to Hostinger…"
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 5;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$HOST';
            mirror -R --verbose --parallel=4 ./_deploy/ /;
          "
