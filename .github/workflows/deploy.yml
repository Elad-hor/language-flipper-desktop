name: Deploy site to Hostinger

# Auto-build the Astro site and upload it to Hostinger over FTPS whenever the
# site changes on main. No more manual File Manager uploads.
# (re-run trigger)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assemble deploy folder (built site + contact.php + .htaccess)
        working-directory: site
        run: |
          rm -rf _deploy && mkdir _deploy
          cp -r dist/. _deploy/
          cp contact/contact.php _deploy/contact.php
          printf '%s\n' \
            'RedirectMatch 301 ^/attributes/?$ /' \
            'RedirectMatch 301 ^/category/uncategorized/?$ /' \
            'RedirectMatch 301 ^/sitemap_index\.xml$ /sitemap-index.xml' \
            > _deploy/.htaccess

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/_deploy/
          # If your FTP account is already rooted at public_html, change this to ./
          server-dir: public_html/
