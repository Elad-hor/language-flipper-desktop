name: Deploy site to Hostinger

# Auto-build the Astro site and upload it to Hostinger over FTPS whenever the
# site changes on main. No more manual File Manager uploads.
# (re-run trigger 2)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without this a hung FTP transfer sits on the runner until GitHub's 6-hour
    # default cap. A healthy run takes under 3 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assemble deploy folder (built site + contact.php + .htaccess)
        working-directory: site
        run: |
          rm -rf _deploy && mkdir _deploy
          cp -r dist/. _deploy/
          cp contact/contact.php _deploy/contact.php
          cat > _deploy/.htaccess <<'HTACCESS'
          RedirectMatch 301 ^/attributes/?$ /
          RedirectMatch 301 ^/category/uncategorized/?$ /
          RedirectMatch 301 ^/sitemap_index\.xml$ /sitemap-index.xml

          # Caching.
          #
          # Hostinger sends no Cache-Control for HTML, only Last-Modified. With
          # no explicit directive browsers fall back to HEURISTIC caching —
          # roughly 10% of the document's age — so after the site had sat
          # unchanged for 14 days, Chrome served a stale copy for ~1.4 days
          # without revalidating. That is why a deploy on 2026-08-10 was
          # invisible outside incognito.
          #
          # HTML must always revalidate; the /_astro/ bundles are content-hashed
          # so their filename changes whenever the bytes do, making them safe to
          # cache permanently.
          <IfModule mod_headers.c>
            # no-cache means "revalidate before reuse", NOT "don't store" — the
            # browser still gets cheap 304s when nothing changed.
            # FilesMatch tests the on-disk filename, so this also covers the
            # extensionless directory URLs (/, /about-us/) that serve index.html.
            <FilesMatch "\.(html|php)$">
              Header set Cache-Control "no-cache, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(xml|txt|json)$">
              Header set Cache-Control "public, max-age=3600"
            </FilesMatch>
          </IfModule>
          HTACCESS
          # Strip the indentation the heredoc carried for readability above.
          sed -i 's/^          //' _deploy/.htaccess

          # Content-hashed build output — safe to cache for a year.
          #
          # This lives in its own directory-scoped .htaccess rather than an
          # expr= condition in the root one: Hostinger runs LiteSpeed, which
          # reads .htaccess but ignored `Header set ... "expr=%{REQUEST_URI}..."`
          # silently, leaving these on Hostinger's default max-age=604800.
          # A plain per-directory rule is honoured by both Apache and LiteSpeed.
          cat > _deploy/_astro/.htaccess <<'ASTROHT'
          <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
          </IfModule>
          ASTROHT
          sed -i 's/^          //' _deploy/_astro/.htaccess

      - name: Deploy over FTPS (curl)
        working-directory: site/_deploy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Tolerate a pasted "ftp://host" or "host/path" in the secret — keep only the host.
          HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#[[:space:]]##g')
          fail=0
          n=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            n=$((n + 1))
            # --max-time is the important one: --connect-timeout alone only caps
            # the handshake, so a transfer that stalls mid-file hangs forever.
            # A run without it sat on this step for 25+ minutes on 2026-08-10.
            # Every file here is small, so 120s is already very generous.
            if ! curl -sS --ssl-reqd -k --ftp-create-dirs \
                 --connect-timeout 30 --max-time 120 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -T "$f" "ftp://$HOST/$rel" --user "$FTP_USERNAME:$FTP_PASSWORD"; then
              echo "FAILED: $rel"
              fail=$((fail + 1))
            else
              # Named per file so a future hang shows exactly where it stopped.
              echo "ok: $rel"
            fi
          done < <(find . -type f -print0)
          echo "Uploaded $((n - fail))/$n files. Failures: $fail"
          [ "$fail" -eq 0 ]
