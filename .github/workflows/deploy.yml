name: Deploy site to Hostinger

# Auto-build the Astro site and upload it to Hostinger over FTPS whenever the
# site changes on main. No more manual File Manager uploads.
# (re-run trigger 2)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without this a hung FTP transfer sits on the runner until GitHub's 6-hour
    # default cap. A healthy run takes under 3 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assemble deploy folder (built site + contact.php + .htaccess)
        working-directory: site
        run: |
          rm -rf _deploy && mkdir _deploy
          cp -r dist/. _deploy/
          cp contact/contact.php _deploy/contact.php
          printf '%s\n' \
            'RedirectMatch 301 ^/attributes/?$ /' \
            'RedirectMatch 301 ^/category/uncategorized/?$ /' \
            'RedirectMatch 301 ^/sitemap_index\.xml$ /sitemap-index.xml' \
            > _deploy/.htaccess

      - name: Deploy over FTPS (curl)
        working-directory: site/_deploy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Tolerate a pasted "ftp://host" or "host/path" in the secret — keep only the host.
          HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#[[:space:]]##g')
          fail=0
          n=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            n=$((n + 1))
            # --max-time is the important one: --connect-timeout alone only caps
            # the handshake, so a transfer that stalls mid-file hangs forever.
            # A run without it sat on this step for 25+ minutes on 2026-08-10.
            # Every file here is small, so 120s is already very generous.
            if ! curl -sS --ssl-reqd -k --ftp-create-dirs \
                 --connect-timeout 30 --max-time 120 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -T "$f" "ftp://$HOST/$rel" --user "$FTP_USERNAME:$FTP_PASSWORD"; then
              echo "FAILED: $rel"
              fail=$((fail + 1))
            else
              # Named per file so a future hang shows exactly where it stopped.
              echo "ok: $rel"
            fi
          done < <(find . -type f -print0)
          echo "Uploaded $((n - fail))/$n files. Failures: $fail"
          [ "$fail" -eq 0 ]
